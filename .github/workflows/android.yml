name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PRESENT: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_PRESENT != '' }}
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_BASE64" | base64 -d > et-release.jks
          cat > keystore.properties <<EOF
          storeFile=../et-release.jks
          storePassword=$KS_STOREPASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEYPASS
          EOF

      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | grep -v unsigned | head -1)
          cp "$APK" LeviLauncher-OS-ET-${GITHUB_REF_NAME:-ci}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviLauncher-OS-ET-apk
          path: LeviLauncher-OS-ET-*.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('keystore.properties') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: LeviLauncher-OS-ET-v*.apk
          generate_release_notes: true
